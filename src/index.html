<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AB</title>
  </head>
  <style>
    :root {
      --col-bg: #fafafa;
      --col-tx: #0c0c0c;

      @media (prefers-color-scheme: dark) {
        --col-bg: #171717;
        --col-tx: #f5f5f5;
      }
    }
    body {
      margin: 0;
      padding: 2rem;
      color: var(--col-tx);
      background: var(--col-bg);
      font-size: 0.96rem;
      font-family:
        Menlo,
        Consolas,
        Monaco,
        Adwaita Mono,
        Liberation Mono,
        Lucida Console,
        monospace;
      -webkit-font-smoothing: antialiased;

      & h1 {
        margin: 0 0 1rem 0;
        font-size: inherit;
        font-weight: unset;
      }

      & ul {
        margin: 0;
        padding: 0;
        display: block;
        list-style-type: "→ ";
        list-style-position: inside;

        & li {
          margin: 0 0 0.6rem 0;
          padding: 0;

          & a {
            color: var(--col-tx);
            font-size: inherit;
            text-underline-offset: 0.15rem;
            text-decoration-skip-ink: none;
          }

          & a:hover {
            color: var(--col-tx);
            text-decoration-thickness: 2px;
          }

          & a:visited {
            color: var(--col-tx);
          }
        }
      }
    }
  </style>

  <body>
    <h1>
      Archie<br />
      Biddiscombe
    </h1>
    <ul>
      <li>
        <a
          href="https://github.com/abiddiscombe"
          rel="noreferrer"
          target="_blank"
          >GitHub</a
        >
      </li>
      <li>
        <a
          href="https://www.linkedin.com/in/abiddiscombe"
          rel="noreferrer"
          target="_blank"
        >
          LinkedIn</a
        >
      </li>
    </ul>
  </body>
</html>
